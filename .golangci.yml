version: "2"
linters:
  enable:
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
    - gosec
    - noctx
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - copyloopvar
    - gocritic
  settings:
    errcheck:
      exclude-functions:
        - io.WriteString
        - (net/http.ResponseWriter).Write
        - fmt.Sscanf
        - (mime/multipart.File).Close
        - (io.Closer).Close
        - (*database/sql.Rows).Close
    gosec:
      excludes:
        - G104
run:
  timeout: 2m
