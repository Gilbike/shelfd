name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binary:
    name: "Publish Binaries"
    runs-on: ubuntu-latest
    steps:
      # Build frontend
      - uses: actions/checkout@v7
      - name: Setup Node and PNPM
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@22
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies & Build
        working-directory: ./web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Build go binary
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ./dist ./release-assets

          targets=(
            "linux amd64 "
            "linux arm64 "
            "windows amd64 .exe"
          )

          for target in "${targets[@]}"; do
            read -r goos goarch ext <<< "$target"
            BINARY_NAME="shelfd-${goos}-${goarch}${ext}"
            
            echo "Building ${BINARY_NAME}..."
            GOOS=$goos GOARCH=$goarch go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "./dist/${BINARY_NAME}" \
              ./cmd/server

            if [ "$goos" = "windows" ]; then
              zip -j "./release-assets/shelfd-${TAG_NAME}-${goos}-${goarch}.zip" "./dist/${BINARY_NAME}"
            else
              tar -czvf "./release-assets/shelfd-${TAG_NAME}-${goos}-${goarch}.tar.gz" -C ./dist "${BINARY_NAME}"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./release-assets/*
          generate_release_notes: true
  docker:
    name: "Release to DockerHub and GHCR"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/gilbike/shelfd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
