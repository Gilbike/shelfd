name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'internal/**'
            frontend:
              - 'web/**'
  test-and-lint-backend:
    name: Backend
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.27"
      - name: Create dummy embed
        run: |
          mkdir -p web/build
          touch web/build/.keep
      - name: Test
        run: go test -v ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
  test-and-lint-frontend:
    name: Frontend
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node and PNPM
        uses: pnpm/setup@v3
        with:
          version: 11
          runtime: node@22
          cache: true
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
